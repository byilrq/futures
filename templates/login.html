<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>登录 · {{ app_name }}</title>
  <link rel="preload" href="{{ url_for('static', filename='login.webp') }}" as="image" type="image/webp">
  <link rel="stylesheet" href="{{ url_for('static', filename='portal.css') }}">
  <style>
    /* Login-only styles. Do not change the shared portal.css. */
    .login-password-field { position: relative; width: 100%; }
    .login-password-field > input { padding-right: 54px; }
    .login-form .login-eye {
      position: absolute;
      right: 7px;
      top: 50%;
      transform: translateY(-50%);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 38px;
      height: 38px;
      min-height: 38px;
      margin: 0;
      padding: 0;
      border: 0;
      border-radius: 10px;
      background: transparent;
      color: var(--muted);
      box-shadow: none;
      cursor: pointer;
      touch-action: manipulation;
    }
    .login-form .login-eye:hover { color: var(--accent); background: var(--accent-bg); }
    .login-form .login-eye:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .login-eye svg { width: 19px; height: 19px; display: block; }
    .login-eye svg[hidden] { display: none; }
  </style>
</head>
<body class="login-body">
  <main class="login-card">
    <img class="login-mark" src="{{ url_for('static', filename='login.webp') }}" alt="" width="82" height="82">
    <h1>{{ app_name }}</h1>
    {% with messages = get_flashed_messages(with_categories=true) %}{% if messages %}<div class="flash-stack" role="alert">{% for category,message in messages %}<div class="flash {{ category }}">{{ message }}</div>{% endfor %}</div>{% endif %}{% endwith %}
    {% if error %}<div class="flash error" role="alert">{{ error }}</div>{% endif %}
    <form class="login-form" method="post" action="{{ url_for('login') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <input type="hidden" name="next" value="{{ request.args.get('next', '') }}">
      <div class="field-block">
        <div class="login-password-field">
          <input id="password" name="password" type="password" autocomplete="current-password" aria-label="密码" placeholder="请输入密码" minlength="6" required autofocus>
          <button id="login-eye-toggle" class="login-eye" type="button" aria-controls="password" aria-label="显示密码" aria-pressed="false" title="显示密码">
            <svg id="login-eye-open" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M2.1 12S5.7 5.6 12 5.6 21.9 12 21.9 12 18.3 18.4 12 18.4 2.1 12 2.1 12Z"/>
              <circle cx="12" cy="12" r="2.8"/>
            </svg>
            <svg id="login-eye-off" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden>
              <path d="M4.2 4.2 19.8 19.8"/>
              <path d="M10.5 5.8A12 12 0 0 1 12 5.6c6.3 0 9.9 6.4 9.9 6.4a16 16 0 0 1-3.6 4.1"/>
              <path d="M6.2 7.4A16.7 16.7 0 0 0 2.1 12s3.6 6.4 9.9 6.4c1.3 0 2.6-.3 3.8-.8"/>
              <path d="M10 10a2.8 2.8 0 0 0 4 4"/>
            </svg>
          </button>
        </div>
      </div>
      <button type="submit" class="primary-btn">登录</button>
    </form>
  </main>
  <script>
    (function () {
      'use strict';
      const password = document.getElementById('password');
      const toggle = document.getElementById('login-eye-toggle');
      const openEye = document.getElementById('login-eye-open');
      const closedEye = document.getElementById('login-eye-off');
      if (!password || !toggle) return;
      toggle.addEventListener('click', function () {
        const visible = password.type === 'password';
        password.type = visible ? 'text' : 'password';
        toggle.setAttribute('aria-pressed', String(visible));
        toggle.setAttribute('aria-label', visible ? '隐藏密码' : '显示密码');
        toggle.title = visible ? '隐藏密码' : '显示密码';
        openEye.hidden = visible;
        closedEye.hidden = !visible;
        password.focus({ preventScroll: true });
      });
    }());
  </script>
</body>
</html>
